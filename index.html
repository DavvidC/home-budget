<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Domowy Budżet</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f0f2f5; color: #222; }
    header { background: linear-gradient(135deg, #1e40af 0%, #2563eb 60%, #3b82f6 100%); color: #fff; padding: 1.25rem 2rem; box-shadow: 0 2px 8px rgba(37,99,235,.35); }
    header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: .02em; }
    .filter-bar { background: #fff; padding: .75rem 2rem; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .year-select { padding: .35rem .6rem; border: 1px solid #d1d5db; border-radius: 6px; font-size: .9rem; width: auto; }
    .month-tabs { display: flex; gap: .35rem; flex-wrap: wrap; }
    .month-tab { padding: .35rem .65rem; border: 1px solid #e5e7eb; border-radius: 6px; font-size: .78rem; cursor: pointer; background: #f9fafb; color: #9ca3af; white-space: nowrap; }
    .month-tab.has-data { color: #374151; font-weight: 600; border-color: #d1d5db; }
    .month-tab.active { background: #2563eb; color: #fff; border-color: #2563eb; font-weight: 600; }
    .summary { display: flex; gap: 1rem; padding: 1.5rem 2rem; flex-wrap: wrap; }
    .card { flex: 1; min-width: 160px; background: #fff; border-radius: 10px; padding: 1rem 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,.10), 0 1px 2px rgba(0,0,0,.06); }
    .card .label { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: #6b7280; font-weight: 600; }
    .card .amount { font-size: 1.75rem; font-weight: 700; margin-top: .35rem; }
    .card.income .amount { color: #16a34a; }
    .card.expenses .amount { color: #dc2626; }
    .card.balance .amount { color: #2563eb; }
    .main { display: flex; gap: 1.5rem; padding: 0 2rem 2rem; flex-wrap: wrap; }
    .form-section, .transactions-section { background: #fff; border-radius: 10px; padding: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,.10), 0 1px 2px rgba(0,0,0,.06); }
    .form-section { flex: 0 0 300px; }
    .transactions-section { flex: 1; min-width: 280px; }
    h2 { font-size: 1rem; font-weight: 700; margin-bottom: 1rem; color: #111827; letter-spacing: .01em; }
    .form-group { margin-bottom: .75rem; }
    label { display: block; font-size: .8rem; color: #555; margin-bottom: .25rem; font-weight: 500; }
    input, select { width: 100%; padding: .5rem .75rem; border: 1px solid #d1d5db; border-radius: 6px; font-size: .9rem; }
    input:focus, select:focus { outline: 2px solid #2563eb; border-color: transparent; }
    .radio-group { display: flex; gap: .75rem; margin-top: .25rem; }
    .radio-group label { display: flex; align-items: center; gap: .35rem; font-size: .9rem; color: #222; cursor: pointer; }
    .radio-group input { width: auto; }
    .add-cat-row { display: flex; gap: .4rem; margin-top: .4rem; }
    .add-cat-row input { flex: 1; width: auto; }
    .add-cat-btn { flex-shrink: 0; padding: .5rem .75rem; background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer; font-size: 1rem; line-height: 1; }
    .add-cat-btn:hover { background: #e5e7eb; }
    button[type=submit] { width: 100%; background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; border: none; padding: .65rem; border-radius: 6px; font-size: .95rem; cursor: pointer; margin-top: .5rem; font-weight: 600; box-shadow: 0 2px 6px rgba(37,99,235,.35); }
    button[type=submit]:hover { background: linear-gradient(135deg, #1d4ed8, #1e40af); }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th { text-align: left; padding: .5rem .75rem; font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: #6b7280; border-bottom: 1px solid #e5e7eb; font-weight: 600; }
    td { padding: .6rem .75rem; border-bottom: 1px solid #f3f4f6; }
    tr:last-child td { border-bottom: none; }
    .badge { display: inline-block; padding: .15rem .5rem; border-radius: 999px; font-size: .75rem; font-weight: 600; }
    .badge.income { background: #dcfce7; color: #15803d; }
    .badge.expense { background: #fee2e2; color: #b91c1c; }
    .del-btn { background: none; border: none; color: #9ca3af; cursor: pointer; font-size: 1rem; padding: 0 .25rem; }
    .del-btn:hover { color: #dc2626; }
    .empty { text-align: center; color: #9ca3af; padding: 2rem; }
    .header-inner { display: flex; align-items: center; justify-content: space-between; }
    .user-info { display: flex; align-items: center; gap: .75rem; }
    .user-name { font-size: .9rem; opacity: .9; }
    .logout-btn { background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3); color: #fff; padding: .35rem .75rem; border-radius: 6px; font-size: .85rem; cursor: pointer; }
    .logout-btn:hover { background: rgba(255,255,255,.25); }
  </style>
</head>
<body>
<header>
  <div class="header-inner">
    <h1>Domowy Budżet</h1>
    <div class="user-info">
      <span class="user-name" id="user-name"></span>
      <form action="/logout" method="post" style="margin:0">
        <button type="submit" class="logout-btn">Wyloguj</button>
      </form>
    </div>
  </div>
</header>

<div class="filter-bar">
  <select id="year-select" class="year-select"></select>
  <div class="month-tabs" id="month-tabs"></div>
</div>

<div class="summary">
  <div class="card income">
    <div class="label">Przychody</div>
    <div class="amount" id="total-income">0,00 zł</div>
  </div>
  <div class="card expenses">
    <div class="label">Wydatki</div>
    <div class="amount" id="total-expenses">0,00 zł</div>
  </div>
  <div class="card balance">
    <div class="label">Saldo</div>
    <div class="amount" id="balance">0,00 zł</div>
  </div>
</div>

<div class="main">
  <div class="form-section">
    <h2>Dodaj transakcję</h2>
    <form id="txn-form">
      <div class="form-group">
        <label>Opis</label>
        <input type="text" id="desc" placeholder="np. Zakupy spożywcze" required>
      </div>
      <div class="form-group">
        <label>Kwota (zł)</label>
        <input type="number" id="amount" min="0.01" step="0.01" placeholder="0.00" required>
      </div>
      <div class="form-group">
        <label>Kategoria</label>
        <select id="category"></select>
        <div class="add-cat-row">
          <input type="text" id="new-cat" placeholder="Nowa kategoria...">
          <button type="button" class="add-cat-btn" id="add-cat-btn">+</button>
        </div>
      </div>
      <div class="form-group">
        <label>Data</label>
        <input type="date" id="date" required>
      </div>
      <div class="form-group">
        <label>Typ</label>
        <div class="radio-group">
          <label><input type="radio" name="type" value="income"> Przychód</label>
          <label><input type="radio" name="type" value="expense" checked> Wydatek</label>
        </div>
      </div>
      <button type="submit">Dodaj transakcję</button>
    </form>
  </div>

  <div class="transactions-section">
    <h2>Transakcje</h2>
    <table>
      <thead>
        <tr>
          <th>Data</th>
          <th>Opis</th>
          <th>Kategoria</th>
          <th>Typ</th>
          <th>Kwota</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="txn-list"></tbody>
    </table>
    <div class="empty" id="empty-msg">Brak transakcji.</div>
  </div>
</div>

<script>
  fetch('/api/me').then(r => {
    if (!r.ok) { window.location.href = '/login'; return; }
    return r.json();
  }).then(user => {
    if (!user) return;
    document.getElementById('user-name').textContent = user.name;
    initApp();
  }).catch(() => { window.location.href = '/login'; });

  function initApp() {
  const BUILT_IN_CATS = ['Wypłata', 'Jedzenie', 'Prąd', 'Leasing', 'Paliwo', 'Inne'];
  const MONTH_NAMES = ['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec','Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];

  let transactions = [];
  let customCats = [];

  const today = new Date();
  let activeYear = today.getFullYear();
  let activeMonth = today.getMonth() + 1;

  const form = document.getElementById('txn-form');
  const list = document.getElementById('txn-list');
  const emptyMsg = document.getElementById('empty-msg');
  const catSelect = document.getElementById('category');
  const newCatInput = document.getElementById('new-cat');
  const yearSelect = document.getElementById('year-select');
  const monthTabsEl = document.getElementById('month-tabs');

  async function loadAll() {
    const [txns, cats] = await Promise.all([
      fetch('/api/transactions').then(r => r.json()),
      fetch('/api/categories').then(r => r.json()),
    ]);
    transactions = txns;
    customCats = cats;
    buildCategorySelect();
    buildYearSelect();
    buildMonthTabs();
    render();
  }

  function buildCategorySelect() {
    const prev = catSelect.value;
    catSelect.innerHTML = '';
    [...BUILT_IN_CATS, ...customCats].forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      catSelect.appendChild(opt);
    });
    if (prev && [...catSelect.options].some(o => o.value === prev)) catSelect.value = prev;
  }

  newCatInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); document.getElementById('add-cat-btn').click(); }
  });

  document.getElementById('add-cat-btn').addEventListener('click', async () => {
    const name = newCatInput.value.trim();
    if (!name) return;
    if ([...BUILT_IN_CATS, ...customCats].includes(name)) {
      catSelect.value = name;
      newCatInput.value = '';
      return;
    }
    const cats = await fetch('/api/categories', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name })
    }).then(r => r.json());
    customCats = cats;
    buildCategorySelect();
    catSelect.value = name;
    newCatInput.value = '';
  });

  function fmt(n) {
    return n.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' zł';
  }

  function getYears() {
    const yrs = new Set([today.getFullYear()]);
    transactions.forEach(t => yrs.add(parseInt(t.date.slice(0, 4), 10)));
    return [...yrs].sort((a, b) => b - a);
  }

  function buildYearSelect() {
    const years = getYears();
    yearSelect.innerHTML = '';
    years.forEach(y => {
      const opt = document.createElement('option');
      opt.value = y;
      opt.textContent = y;
      yearSelect.appendChild(opt);
    });
    if (years.includes(activeYear)) {
      yearSelect.value = activeYear;
    } else {
      activeYear = years[0];
      yearSelect.value = activeYear;
    }
  }

  function buildMonthTabs() {
    monthTabsEl.innerHTML = '';
    const monthsWithData = new Set(
      transactions
        .filter(t => parseInt(t.date.slice(0, 4), 10) === activeYear)
        .map(t => parseInt(t.date.slice(5, 7), 10))
    );
    MONTH_NAMES.forEach((name, i) => {
      const m = i + 1;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'month-tab' +
        (monthsWithData.has(m) ? ' has-data' : '') +
        (m === activeMonth ? ' active' : '');
      btn.textContent = name;
      btn.dataset.month = m;
      monthTabsEl.appendChild(btn);
    });
  }

  monthTabsEl.addEventListener('click', e => {
    const btn = e.target.closest('.month-tab');
    if (!btn) return;
    activeMonth = parseInt(btn.dataset.month, 10);
    buildMonthTabs();
    render();
  });

  yearSelect.addEventListener('change', () => {
    activeYear = parseInt(yearSelect.value, 10);
    buildMonthTabs();
    render();
  });

  function render() {
    list.innerHTML = '';
    const prefix = activeYear + '-' + String(activeMonth).padStart(2, '0');
    const filtered = transactions.filter(t => t.date.startsWith(prefix));
    const sorted = [...filtered].sort((a, b) => b.date.localeCompare(a.date));
    sorted.forEach(t => {
      const tr = document.createElement('tr');
      const tdDate = document.createElement('td'); tdDate.textContent = t.date;
      const tdDesc = document.createElement('td'); tdDesc.textContent = t.desc;
      const tdCat = document.createElement('td'); tdCat.textContent = t.category || '—';
      const tdType = document.createElement('td');
      const badge = document.createElement('span');
      badge.className = 'badge ' + t.type;
      badge.textContent = t.type === 'income' ? 'przychód' : 'wydatek';
      tdType.appendChild(badge);
      const tdAmt = document.createElement('td'); tdAmt.textContent = fmt(t.amountCents / 100);
      const tdDel = document.createElement('td');
      const delBtn = document.createElement('button');
      delBtn.className = 'del-btn'; delBtn.dataset.id = t.id; delBtn.title = 'Usuń'; delBtn.textContent = '✕';
      tdDel.appendChild(delBtn);
      [tdDate, tdDesc, tdCat, tdType, tdAmt, tdDel].forEach(td => tr.appendChild(td));
      list.appendChild(tr);
    });
    emptyMsg.style.display = filtered.length ? 'none' : 'block';

    const income = filtered.filter(t => t.type === 'income').reduce((s, t) => s + t.amountCents, 0);
    const expenses = filtered.filter(t => t.type === 'expense').reduce((s, t) => s + t.amountCents, 0);
    document.getElementById('total-income').textContent = fmt(income / 100);
    document.getElementById('total-expenses').textContent = fmt(expenses / 100);
    document.getElementById('balance').textContent = fmt((income - expenses) / 100);
  }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const type = form.querySelector('input[name=type]:checked').value;
    const dateVal = document.getElementById('date').value;
    const txn = await fetch('/api/transactions', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        id: crypto.randomUUID(),
        desc: document.getElementById('desc').value.trim(),
        amountCents: Math.round(parseFloat(document.getElementById('amount').value) * 100),
        category: catSelect.value,
        date: dateVal, type
      })
    }).then(r => r.json());
    transactions.push(txn);
    activeYear = parseInt(dateVal.slice(0, 4), 10);
    activeMonth = parseInt(dateVal.slice(5, 7), 10);
    buildYearSelect();
    buildMonthTabs();
    render();
    form.reset();
    document.getElementById('date').valueAsDate = new Date();
    form.querySelector('input[name=type][value=expense]').checked = true;
    buildCategorySelect();
  });

  list.addEventListener('click', async e => {
    const btn = e.target.closest('.del-btn');
    if (!btn) return;
    await fetch('/api/transactions/' + btn.dataset.id, { method: 'DELETE' });
    transactions = transactions.filter(t => t.id !== btn.dataset.id);
    buildYearSelect();
    buildMonthTabs();
    render();
  });

  document.getElementById('date').valueAsDate = new Date();
  loadAll();
  setInterval(async () => {
    const txns = await fetch('/api/transactions').then(r => r.json());
    transactions = txns;
    buildYearSelect();
    buildMonthTabs();
    render();
  }, 10000);
  } // end initApp
</script>
</body>
</html>
