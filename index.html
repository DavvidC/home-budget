<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Domowy Budżet</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f0f2f5; color: #222; }
    header { background: linear-gradient(135deg, #1e40af 0%, #2563eb 60%, #3b82f6 100%); color: #fff; padding: 1.25rem 2rem; box-shadow: 0 2px 8px rgba(37,99,235,.35); }
    header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: .02em; }
    .tab-bar { display: flex; background: #fff; border-bottom: 1px solid #e5e7eb; padding: 0 2rem; }
    .tab { background: none; border: none; padding: .75rem 1.5rem; font-size: .95rem; font-weight: 600; color: #6b7280; cursor: pointer; border-bottom: 2px solid transparent; }
    .tab.active { color: #2563eb; border-bottom-color: #2563eb; }
    .tab:hover { color: #2563eb; }
    .filter-bar { background: #fff; padding: .75rem 2rem; border-bottom: 1px solid #e5e7eb; display: flex; flex-direction: column; gap: .5rem; }
    .preset-chips { display: flex; gap: .35rem; flex-wrap: wrap; }
    .preset-chip { padding: .35rem .65rem; border: 1px solid #e5e7eb; border-radius: 6px; font-size: .78rem; cursor: pointer; background: #f9fafb; color: #374151; white-space: nowrap; }
    .preset-chip.active { background: #2563eb; color: #fff; border-color: #2563eb; font-weight: 600; }
    .custom-date-row { display: none; align-items: center; gap: .5rem; flex-wrap: wrap; }
    .summary { display: flex; gap: 1rem; padding: 1.5rem 2rem; flex-wrap: wrap; }
    .card { flex: 1; min-width: 160px; background: #fff; border-radius: 10px; padding: 1rem 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,.10), 0 1px 2px rgba(0,0,0,.06); }
    .card .label { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: #6b7280; font-weight: 600; }
    .card .amount { font-size: 1.75rem; font-weight: 700; margin-top: .35rem; }
    .card.income .amount { color: #16a34a; }
    .card.expenses .amount { color: #dc2626; }
    .card.balance .amount { color: #2563eb; }
    .main { display: flex; gap: 1.5rem; padding: 0 2rem 2rem; flex-wrap: wrap; }
    .form-section, .transactions-section { background: #fff; border-radius: 10px; padding: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,.10), 0 1px 2px rgba(0,0,0,.06); }
    .form-section { flex: 0 0 300px; }
    .transactions-section { flex: 1; min-width: 280px; }
    h2 { font-size: 1rem; font-weight: 700; margin-bottom: 1rem; color: #111827; letter-spacing: .01em; }
    .form-group { margin-bottom: .75rem; }
    label { display: block; font-size: .8rem; color: #555; margin-bottom: .25rem; font-weight: 500; }
    input, select { width: 100%; padding: .5rem .75rem; border: 1px solid #d1d5db; border-radius: 6px; font-size: .9rem; }
    input:focus, select:focus { outline: 2px solid #2563eb; border-color: transparent; }
    .radio-group { display: flex; gap: .75rem; margin-top: .25rem; }
    .radio-group label { display: flex; align-items: center; gap: .35rem; font-size: .9rem; color: #222; cursor: pointer; }
    .radio-group input { width: auto; }
    .add-cat-row { display: flex; gap: .4rem; margin-top: .4rem; }
    .add-cat-row input { flex: 1; width: auto; }
    .add-cat-btn { flex-shrink: 0; padding: .5rem .75rem; background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer; font-size: 1rem; line-height: 1; }
    .add-cat-btn:hover { background: #e5e7eb; }
    button[type=submit] { width: 100%; background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; border: none; padding: .65rem; border-radius: 6px; font-size: .95rem; cursor: pointer; margin-top: .5rem; font-weight: 600; box-shadow: 0 2px 6px rgba(37,99,235,.35); }
    button[type=submit]:hover { background: linear-gradient(135deg, #1d4ed8, #1e40af); }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th { text-align: left; padding: .5rem .75rem; font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: #6b7280; border-bottom: 1px solid #e5e7eb; font-weight: 600; }
    td { padding: .6rem .75rem; border-bottom: 1px solid #f3f4f6; }
    tr:last-child td { border-bottom: none; }
    .badge { display: inline-block; padding: .15rem .5rem; border-radius: 999px; font-size: .75rem; font-weight: 600; }
    .badge.income { background: #dcfce7; color: #15803d; }
    .badge.expense { background: #fee2e2; color: #b91c1c; }
    .del-btn { background: none; border: none; color: #9ca3af; cursor: pointer; font-size: 1rem; padding: 0 .25rem; }
    .del-btn:hover { color: #dc2626; }
    .empty { text-align: center; color: #9ca3af; padding: 2rem; }
    .header-inner { display: flex; align-items: center; justify-content: space-between; }
    .user-info { display: flex; align-items: center; gap: .75rem; }
    .user-name { font-size: .9rem; opacity: .9; }
    .logout-btn { background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3); color: #fff; padding: .35rem .75rem; border-radius: 6px; font-size: .85rem; cursor: pointer; }
    .logout-btn:hover { background: rgba(255,255,255,.25); }
    .import-btn { background: #f3f4f6; border: 1px solid #d1d5db; color: #374151; padding: .35rem .75rem; border-radius: 6px; font-size: .85rem; cursor: pointer; font-weight: 500; }
    .import-btn:hover { background: #e5e7eb; }
    .import-status { font-size: .8rem; color: #6b7280; }
    .bulk-del-btn { display: none; background: #dc2626; border: none; color: #fff; padding: .35rem .75rem; border-radius: 6px; font-size: .85rem; cursor: pointer; font-weight: 500; }
    .bulk-del-btn:hover { background: #b91c1c; }
    .bulk-del-btn.visible { display: inline-block; }
    th.cb-col, td.cb-col { width: 2rem; padding-left: .75rem; }
    .charts-panel { display: none; padding: 1.5rem 2rem; }
    .charts-filter { margin-bottom: 1.5rem; display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }
    .charts-filter select { width: auto; }
    .charts-custom-row { display: none; align-items: center; gap: .5rem; }
    .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 1.5rem; }
    .chart-card { background: #fff; border-radius: 10px; padding: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,.10), 0 1px 2px rgba(0,0,0,.06); }
    .chart-card h3 { font-size: .95rem; font-weight: 700; margin-bottom: 1rem; color: #111827; display: flex; align-items: center; justify-content: space-between; }
    .chart-card h3 select { font-size: .78rem; padding: .2rem .4rem; border: 1px solid #d1d5db; border-radius: 6px; width: auto; font-weight: 500; color: #374151; }
    @media (max-width: 640px) { .charts-grid { grid-template-columns: 1fr; } }
    .donut-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 1000; justify-content: center; align-items: center; }
    .donut-modal-overlay.open { display: flex; }
    .donut-modal { background: #fff; border-radius: 10px; width: 720px; max-height: 80vh; display: flex; flex-direction: column; box-shadow: 0 8px 32px rgba(0,0,0,.25); }
    .donut-modal-header { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.5rem; border-bottom: 1px solid #e5e7eb; }
    .donut-modal-header h3 { font-size: 1rem; font-weight: 700; color: #111827; margin: 0; }
    .donut-modal-close { background: none; border: none; font-size: 1.25rem; cursor: pointer; color: #6b7280; padding: .25rem; line-height: 1; }
    .donut-modal-close:hover { color: #111827; }
    .donut-modal-body { overflow-y: auto; padding: 1rem 1.5rem; }
    .donut-modal-body table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    .donut-modal-body th { text-align: left; padding: .5rem .75rem; font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: #6b7280; border-bottom: 1px solid #e5e7eb; font-weight: 600; }
    .donut-modal-body td { padding: .6rem .75rem; border-bottom: 1px solid #f3f4f6; }
    .donut-modal-summary { padding: .75rem 1.5rem; border-top: 1px solid #e5e7eb; font-size: .85rem; font-weight: 600; color: #374151; }
    @media (max-width: 640px) { .donut-modal { width: calc(100% - 2rem); } }
  </style>
</head>
<body>
<header>
  <div class="header-inner">
    <h1>Domowy Budżet</h1>
    <div class="user-info">
      <span class="user-name" id="user-name"></span>
      <form action="/logout" method="post" style="margin:0">
        <button type="submit" class="logout-btn">Wyloguj</button>
      </form>
    </div>
  </div>
</header>

<div class="tab-bar">
  <button type="button" class="tab active" id="tab-transakcje">Transakcje</button>
  <button type="button" class="tab" id="tab-wykresy">Wykresy</button>
</div>

<div class="filter-bar">
  <div class="preset-chips" id="preset-chips">
    <button type="button" class="preset-chip" data-preset="month">Ten miesiąc</button>
    <button type="button" class="preset-chip" data-preset="week">Ostatni tydzień</button>
    <button type="button" class="preset-chip" data-preset="2weeks">Ostatnie 2 tygodnie</button>
    <button type="button" class="preset-chip" data-preset="30days">Ostatnie 30 dni</button>
    <button type="button" class="preset-chip" data-preset="custom">Niestandardowy</button>
  </div>
  <div class="custom-date-row" id="filter-custom-row">
    <label style="margin:0">Miesiąc:</label>
    <select id="filter-month-select" style="width:auto"></select>
    <label style="margin:0">Od:</label>
    <input type="date" id="filter-from" style="width:auto">
    <label style="margin:0">Do:</label>
    <input type="date" id="filter-to" style="width:auto">
  </div>
</div>

<div class="summary">
  <div class="card income">
    <div class="label">Przychody</div>
    <div class="amount" id="total-income">0,00 zł</div>
  </div>
  <div class="card expenses">
    <div class="label">Wydatki</div>
    <div class="amount" id="total-expenses">0,00 zł</div>
  </div>
  <div class="card balance">
    <div class="label">Saldo</div>
    <div class="amount" id="balance">0,00 zł</div>
  </div>
</div>

<div class="main">
  <div class="form-section">
    <h2>Dodaj transakcję</h2>
    <form id="txn-form">
      <div class="form-group">
        <label>Opis</label>
        <input type="text" id="desc" placeholder="np. Zakupy spożywcze" required>
      </div>
      <div class="form-group">
        <label>Kwota (zł)</label>
        <input type="number" id="amount" min="0.01" step="0.01" placeholder="0.00" required>
      </div>
      <div class="form-group">
        <label>Kategoria</label>
        <select id="category"></select>
        <div class="add-cat-row">
          <input type="text" id="new-cat" placeholder="Nowa kategoria...">
          <button type="button" class="add-cat-btn" id="add-cat-btn">+</button>
        </div>
      </div>
      <div class="form-group">
        <label>Data</label>
        <input type="date" id="date" required>
      </div>
      <div class="form-group">
        <label>Typ</label>
        <div class="radio-group">
          <label><input type="radio" name="type" value="income"> Przychód</label>
          <label><input type="radio" name="type" value="expense" checked> Wydatek</label>
        </div>
      </div>
      <button type="submit">Dodaj transakcję</button>
    </form>
  </div>

  <div class="transactions-section">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
      <h2 style="margin-bottom:0">Transakcje</h2>
      <div style="display:flex;align-items:center;gap:.75rem">
        <button type="button" class="bulk-del-btn" id="bulk-del-btn">Usuń zaznaczone</button>
        <span class="import-status" id="import-status"></span>
        <input type="file" id="import-file" accept=".txt,.csv" style="display:none">
        <button type="button" class="import-btn" id="import-btn">Importuj wyciag</button>
      </div>
    </div>
    <table>
      <thead>
        <tr>
          <th class="cb-col"><input type="checkbox" id="select-all"></th>
          <th>Data</th>
          <th>Tytuł</th>
          <th>Odbiorca</th>
          <th>Opis</th>
          <th>Kategoria</th>
          <th>Typ</th>
          <th>Kwota</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="txn-list"></tbody>
    </table>
    <div class="empty" id="empty-msg">Brak transakcji.</div>
  </div>
</div>

<div class="charts-panel" id="charts-panel">
  <div class="charts-filter">
    <select id="charts-month-select"></select>
    <div class="charts-custom-row" id="charts-custom-row">
      <label style="margin:0">Od:</label>
      <input type="date" id="charts-from" style="width:auto">
      <label style="margin:0">Do:</label>
      <input type="date" id="charts-to" style="width:auto">
    </div>
  </div>
  <div class="charts-grid">
    <div class="chart-card">
      <h3>Wydatki wg kategorii</h3>
      <canvas id="chart-donut"></canvas>
    </div>
    <div class="chart-card">
      <h3>Trend miesięczny</h3>
      <canvas id="chart-trend"></canvas>
    </div>
    <div class="chart-card">
      <h3>Top 10 odbiorców <select id="top10-mode"><option value="amount">wg kwoty</option><option value="count">wg liczby transakcji</option></select></h3>
      <div style="position:relative;height:320px"><canvas id="chart-top10"></canvas></div>
    </div>
  </div>
</div>

<div class="donut-modal-overlay" id="donut-modal">
  <div class="donut-modal">
    <div class="donut-modal-header">
      <h3 id="donut-modal-title"></h3>
      <button type="button" class="donut-modal-close" id="donut-modal-close">✕</button>
    </div>
    <div class="donut-modal-body">
      <table>
        <thead><tr><th>Data</th><th>Odbiorca</th><th>Opis</th><th>Kwota</th></tr></thead>
        <tbody id="donut-modal-rows"></tbody>
      </table>
    </div>
    <div class="donut-modal-summary" id="donut-modal-summary"></div>
  </div>
</div>

<script>
  fetch('/api/me').then(r => {
    if (!r.ok) { window.location.href = '/login'; return; }
    return r.json();
  }).then(user => {
    if (!user) return;
    const nameEl = document.getElementById('user-name');
    if (nameEl) nameEl.textContent = user.name;
    initApp();
  }).catch(() => { window.location.href = '/login'; });

  async function initApp() {
  let transactions = [];
  let categories = [];

  async function loadData() {
    const [txnsRes, catsRes] = await Promise.all([
      fetch('/api/transactions'),
      fetch('/api/categories')
    ]);
    transactions = await txnsRes.json();
    categories = await catsRes.json();
  }

  const form = document.getElementById('txn-form');
  const list = document.getElementById('txn-list');
  const emptyMsg = document.getElementById('empty-msg');
  const catSelect = document.getElementById('category');
  const newCatInput = document.getElementById('new-cat');

  function buildCategorySelect() {
    const prev = catSelect.value;
    catSelect.innerHTML = '';
    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      catSelect.appendChild(opt);
    });
    if (prev && [...catSelect.options].some(o => o.value === prev)) catSelect.value = prev;
  }

  newCatInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); document.getElementById('add-cat-btn').click(); }
  });

  document.getElementById('add-cat-btn').addEventListener('click', async () => {
    const name = newCatInput.value.trim();
    if (!name) return;
    if (categories.includes(name)) {
      catSelect.value = name;
      newCatInput.value = '';
      return;
    }
    await fetch('/api/categories', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name})
    });
    categories.push(name);
    categories.sort((a, b) => a.localeCompare(b));
    buildCategorySelect();
    catSelect.value = name;
    newCatInput.value = '';
  });

  function fmt(n) {
    return n.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' zł';
  }

  function toYMD(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  let filterFrom = '';
  let filterTo = '';
  let activePreset = 'month';

  function setPreset(preset) {
    activePreset = preset;
    const now = new Date();
    const todayStr = toYMD(now);

    if (preset === 'month') {
      filterFrom = todayStr.slice(0, 7) + '-01';
      filterTo = toYMD(new Date(now.getFullYear(), now.getMonth() + 1, 0));
    } else if (preset === 'week') {
      const from = new Date(now);
      from.setDate(from.getDate() - 6);
      filterFrom = toYMD(from);
      filterTo = todayStr;
    } else if (preset === '2weeks') {
      const from = new Date(now);
      from.setDate(from.getDate() - 13);
      filterFrom = toYMD(from);
      filterTo = todayStr;
    } else if (preset === '30days') {
      const from = new Date(now);
      from.setDate(from.getDate() - 29);
      filterFrom = toYMD(from);
      filterTo = todayStr;
    } else if (preset === 'custom') {
      const fromEl = document.getElementById('filter-from');
      const toEl = document.getElementById('filter-to');
      if (!fromEl.value) fromEl.value = todayStr;
      if (!toEl.value) toEl.value = todayStr;
      filterFrom = fromEl.value;
      filterTo = toEl.value;
    }

    document.querySelectorAll('.preset-chip').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.preset === preset);
    });
    document.getElementById('filter-custom-row').style.display = preset === 'custom' ? 'flex' : 'none';

    render();
  }

  document.getElementById('preset-chips').addEventListener('click', e => {
    const btn = e.target.closest('.preset-chip');
    if (!btn) return;
    setPreset(btn.dataset.preset);
  });

  const PL_MONTHS = ['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec','Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];

  function buildFilterMonthSelect() {
    const sel = document.getElementById('filter-month-select');
    const prev = sel.value;
    const months = new Set();
    transactions.forEach(t => months.add(t.date.slice(0, 7)));
    const now = new Date();
    months.add(toYMD(now).slice(0, 7));
    const sorted = [...months].sort().reverse();
    sel.innerHTML = '<option value="">— wybierz —</option>';
    sorted.forEach(ym => {
      const [y, m] = ym.split('-');
      const opt = document.createElement('option');
      opt.value = ym;
      opt.textContent = PL_MONTHS[parseInt(m, 10) - 1] + ' ' + y;
      sel.appendChild(opt);
    });
    if (prev && [...sel.options].some(o => o.value === prev)) sel.value = prev;
  }

  document.getElementById('filter-month-select').addEventListener('change', e => {
    const val = e.target.value;
    if (!val) return;
    const [y, m] = val.split('-');
    const fromStr = val + '-01';
    const toStr = toYMD(new Date(parseInt(y), parseInt(m), 0));
    document.getElementById('filter-from').value = fromStr;
    document.getElementById('filter-to').value = toStr;
    filterFrom = fromStr;
    filterTo = toStr;
    render();
  });

  document.getElementById('filter-from').addEventListener('change', () => {
    document.getElementById('filter-month-select').value = '';
    filterFrom = document.getElementById('filter-from').value;
    render();
  });

  document.getElementById('filter-to').addEventListener('change', () => {
    document.getElementById('filter-month-select').value = '';
    filterTo = document.getElementById('filter-to').value;
    render();
  });

  function render() {
    document.getElementById('bulk-del-btn').classList.remove('visible');
    document.getElementById('select-all').checked = false;
    list.innerHTML = '';
    const filtered = transactions.filter(t => t.date >= filterFrom && t.date <= filterTo);
    const sorted = [...filtered].sort((a, b) => b.date.localeCompare(a.date));
    sorted.forEach(t => {
      const tr = document.createElement('tr');
      const tdCb = document.createElement('td');
      tdCb.className = 'cb-col';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.className = 'row-cb';
      cb.dataset.id = t.id;
      tdCb.appendChild(cb);
      const tdDate = document.createElement('td');
      tdDate.textContent = t.date;
      const tdDesc = document.createElement('td');
      tdDesc.textContent = t.desc;
      const tdOdbiorca = document.createElement('td');
      tdOdbiorca.textContent = t.odbiorca || '';
      const tdComment = document.createElement('td');
      const commentText = t.comment || '';
      tdComment.textContent = commentText.length > 40 ? commentText.slice(0, 40) + '…' : commentText;
      tdComment.style.cursor = 'pointer';
      tdComment.title = 'Kliknij aby edytować';
      tdComment.addEventListener('click', () => {
        if (tdComment.querySelector('input')) return;
        const inp = document.createElement('input');
        inp.type = 'text';
        inp.value = t.comment || '';
        inp.style.width = '100%';
        tdComment.textContent = '';
        tdComment.appendChild(inp);
        inp.focus();
        const save = async () => {
          const newVal = inp.value.trim();
          if (newVal !== (t.comment || '')) {
            await fetch('/api/transactions/' + t.id, {
              method: 'PATCH',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({ comment: newVal, desc: newVal })
            });
            t.comment = newVal;
            t.desc = newVal;
          }
          tdComment.textContent = newVal.length > 40 ? newVal.slice(0, 40) + '…' : newVal;
        };
        inp.addEventListener('blur', save);
        inp.addEventListener('keydown', e => { if (e.key === 'Enter') inp.blur(); });
      });
      const tdCat = document.createElement('td');
      tdCat.textContent = t.category || '—';
      tdCat.style.cursor = 'pointer';
      tdCat.title = 'Kliknij aby zmienić';
      tdCat.addEventListener('click', () => {
        if (tdCat.querySelector('select')) return;
        const sel = document.createElement('select');
        sel.style.width = '100%';
        categories.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c; opt.textContent = c;
          if (c === t.category) opt.selected = true;
          sel.appendChild(opt);
        });
        tdCat.textContent = '';
        tdCat.appendChild(sel);
        sel.focus();
        const save = async () => {
          const newCat = sel.value;
          if (newCat !== t.category) {
            await fetch('/api/transactions/' + t.id, {
              method: 'PATCH',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({ category: newCat })
            });
            t.category = newCat;
          }
          tdCat.textContent = newCat;
        };
        sel.addEventListener('change', save);
        sel.addEventListener('blur', save);
      });
      const tdType = document.createElement('td');
      const badge = document.createElement('span');
      badge.className = 'badge ' + t.type;
      badge.textContent = t.type === 'income' ? 'przychód' : 'wydatek';
      tdType.appendChild(badge);
      const tdAmt = document.createElement('td');
      tdAmt.textContent = fmt(t.amountCents / 100);
      const tdDel = document.createElement('td');
      const delBtn = document.createElement('button');
      delBtn.className = 'del-btn';
      delBtn.dataset.id = t.id;
      delBtn.title = 'Usuń';
      delBtn.textContent = '✕';
      tdDel.appendChild(delBtn);
      [tdCb, tdDate, tdDesc, tdOdbiorca, tdComment, tdCat, tdType, tdAmt, tdDel].forEach(td => tr.appendChild(td));
      list.appendChild(tr);
    });
    emptyMsg.style.display = filtered.length ? 'none' : 'block';

    const income = filtered.filter(t => t.type === 'income').reduce((s, t) => s + t.amountCents, 0);
    const expenses = filtered.filter(t => t.type === 'expense').reduce((s, t) => s + t.amountCents, 0);
    document.getElementById('total-income').textContent = fmt(income / 100);
    document.getElementById('total-expenses').textContent = fmt(expenses / 100);
    document.getElementById('balance').textContent = fmt((income - expenses) / 100);
  }

  document.getElementById('import-btn').addEventListener('click', () => {
    document.getElementById('import-file').click();
  });

  document.getElementById('import-file').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    const text = await file.text();
    const res = await fetch('/api/import', {
      method: 'POST',
      headers: {'Content-Type': 'text/plain'},
      body: text
    });
    const result = await res.json();
    document.getElementById('import-status').textContent =
      `Zaimportowano ${result.imported} transakcji (Pominieto ${result.skipped} duplikatow)`;
    e.target.value = '';
    await loadData();
    render();
  });

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const type = form.querySelector('input[name=type]:checked').value;
    const dateVal = document.getElementById('date').value;
    const res = await fetch('/api/transactions', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        desc: document.getElementById('desc').value.trim(),
        amountCents: Math.round(parseFloat(document.getElementById('amount').value) * 100),
        category: catSelect.value,
        date: dateVal,
        type
      })
    });
    const saved = await res.json();
    transactions.push(saved);
    render();
    form.reset();
    document.getElementById('date').valueAsDate = new Date();
    form.querySelector('input[name=type][value=expense]').checked = true;
    buildCategorySelect();
  });

  list.addEventListener('click', async e => {
    const btn = e.target.closest('.del-btn');
    if (!btn) return;
    await fetch('/api/transactions/' + btn.dataset.id, {method: 'DELETE'});
    transactions = transactions.filter(t => t.id !== btn.dataset.id);
    render();
  });

  list.addEventListener('change', e => {
    if (!e.target.classList.contains('row-cb')) return;
    const checked = list.querySelectorAll('.row-cb:checked');
    document.getElementById('bulk-del-btn').classList.toggle('visible', checked.length > 0);
    const all = list.querySelectorAll('.row-cb');
    document.getElementById('select-all').checked = all.length > 0 && checked.length === all.length;
  });

  document.getElementById('select-all').addEventListener('change', e => {
    list.querySelectorAll('.row-cb').forEach(cb => { cb.checked = e.target.checked; });
    const checked = list.querySelectorAll('.row-cb:checked');
    document.getElementById('bulk-del-btn').classList.toggle('visible', checked.length > 0);
  });

  document.getElementById('bulk-del-btn').addEventListener('click', async () => {
    const ids = [...list.querySelectorAll('.row-cb:checked')].map(cb => cb.dataset.id);
    if (!ids.length) return;
    await fetch('/api/transactions', {
      method: 'DELETE',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ids})
    });
    transactions = transactions.filter(t => !ids.includes(t.id));
    document.getElementById('bulk-del-btn').classList.remove('visible');
    document.getElementById('select-all').checked = false;
    render();
  });

  // --- Charts ---
  const PL_MONTHS_SHORT = ['Sty','Lut','Mar','Kwi','Maj','Cze','Lip','Sie','Wrz','Paź','Lis','Gru'];
  const PL_MONTHS_FULL = ['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec','Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];
  const CHART_COLORS = ['#2563eb','#dc2626','#16a34a','#f59e0b','#8b5cf6','#ec4899','#06b6d4','#84cc16','#f97316','#6366f1','#14b8a6','#e11d48','#a855f7','#eab308','#0ea5e9','#d946ef'];

  let chartsActive = false;
  let donutChart = null, trendChart = null, top10Chart = null;
  let chartFilterFrom = '', chartFilterTo = '';

  document.getElementById('tab-transakcje').addEventListener('click', () => {
    chartsActive = false;
    document.getElementById('tab-transakcje').classList.add('active');
    document.getElementById('tab-wykresy').classList.remove('active');
    document.querySelector('.filter-bar').style.display = '';
    document.querySelector('.summary').style.display = '';
    document.querySelector('.main').style.display = '';
    document.getElementById('charts-panel').style.display = 'none';
    render();
  });

  document.getElementById('tab-wykresy').addEventListener('click', () => {
    chartsActive = true;
    document.getElementById('tab-wykresy').classList.add('active');
    document.getElementById('tab-transakcje').classList.remove('active');
    document.querySelector('.filter-bar').style.display = 'none';
    document.querySelector('.summary').style.display = 'none';
    document.querySelector('.main').style.display = 'none';
    document.getElementById('charts-panel').style.display = 'block';
    buildChartsFilter();
    renderCharts();
  });

  function buildChartsFilter() {
    const sel = document.getElementById('charts-month-select');
    const prevVal = sel.value;
    const months = new Set();
    transactions.forEach(t => { months.add(t.date.slice(0, 7)); });
    const now = new Date();
    const curMonth = toYMD(now).slice(0, 7);
    months.add(curMonth);
    const sorted = [...months].sort().reverse();
    sel.innerHTML = '';
    sorted.forEach(ym => {
      const [y, m] = ym.split('-');
      const opt = document.createElement('option');
      opt.value = ym;
      opt.textContent = PL_MONTHS_FULL[parseInt(m, 10) - 1] + ' ' + y;
      sel.appendChild(opt);
    });
    const customOpt = document.createElement('option');
    customOpt.value = 'custom';
    customOpt.textContent = 'Niestandardowy';
    sel.appendChild(customOpt);

    if (prevVal && [...sel.options].some(o => o.value === prevVal)) {
      sel.value = prevVal;
    } else {
      sel.value = curMonth;
    }
    setChartDateRange(sel.value);
  }

  function setChartDateRange(val) {
    if (val === 'custom') {
      document.getElementById('charts-custom-row').style.display = 'flex';
      const fromEl = document.getElementById('charts-from');
      const toEl = document.getElementById('charts-to');
      if (!fromEl.value) fromEl.value = toYMD(new Date());
      if (!toEl.value) toEl.value = toYMD(new Date());
      chartFilterFrom = fromEl.value;
      chartFilterTo = toEl.value;
    } else {
      document.getElementById('charts-custom-row').style.display = 'none';
      const [y, m] = val.split('-');
      chartFilterFrom = val + '-01';
      chartFilterTo = toYMD(new Date(parseInt(y), parseInt(m), 0));
    }
  }

  document.getElementById('charts-month-select').addEventListener('change', e => {
    setChartDateRange(e.target.value);
    renderDonut();
    renderTop10();
  });

  document.getElementById('charts-from').addEventListener('change', () => {
    chartFilterFrom = document.getElementById('charts-from').value;
    renderDonut();
    renderTop10();
  });

  document.getElementById('charts-to').addEventListener('change', () => {
    chartFilterTo = document.getElementById('charts-to').value;
    renderDonut();
    renderTop10();
  });

  const centerTextPlugin = {
    id: 'centerText',
    afterDraw(chart) {
      if (chart.config.type !== 'doughnut') return;
      const { ctx, chartArea: { top, bottom, left, right } } = chart;
      const cx = (left + right) / 2;
      const cy = (top + bottom) / 2;
      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = 'bold 16px system-ui';
      ctx.fillStyle = '#222';
      ctx.fillText(chart._centerLabel || '', cx, cy);
      ctx.restore();
    }
  };

  function renderCharts() {
    renderDonut();
    renderTrend();
    renderTop10();
  }

  function renderDonut() {
    const filtered = transactions.filter(t => t.type === 'expense' && t.date >= chartFilterFrom && t.date <= chartFilterTo);
    const byCategory = {};
    filtered.forEach(t => {
      const cat = t.category || 'Inne';
      byCategory[cat] = (byCategory[cat] || 0) + t.amountCents;
    });
    const labels = Object.keys(byCategory);
    const data = Object.values(byCategory).map(v => v / 100);
    const total = data.reduce((s, v) => s + v, 0);

    if (donutChart) donutChart.destroy();
    donutChart = new Chart(document.getElementById('chart-donut'), {
      type: 'doughnut',
      data: {
        labels,
        datasets: [{ data, backgroundColor: CHART_COLORS.slice(0, labels.length), borderWidth: 1 }]
      },
      plugins: [centerTextPlugin],
      options: {
        responsive: true,
        plugins: { legend: { position: 'bottom' } },
        onClick(evt, elements) {
          if (!elements.length) return;
          const idx = elements[0].index;
          const category = labels[idx];
          openDonutModal(category);
        }
      }
    });
    donutChart._centerLabel = fmt(total);
  }

  function openDonutModal(category) {
    const matchCat = category === 'Inne' ? t => !t.category : t => t.category === category;
    const rows = transactions
      .filter(t => t.type === 'expense' && t.date >= chartFilterFrom && t.date <= chartFilterTo && matchCat(t))
      .sort((a, b) => b.date.localeCompare(a.date));
    const total = rows.reduce((s, t) => s + t.amountCents, 0) / 100;
    document.getElementById('donut-modal-title').textContent = category + ' — ' + fmt(total);
    const tbody = document.getElementById('donut-modal-rows');
    tbody.innerHTML = '';
    rows.forEach(t => {
      const tr = document.createElement('tr');
      const tdDate = document.createElement('td'); tdDate.textContent = t.date;
      const tdOdb = document.createElement('td'); tdOdb.textContent = t.odbiorca || '';
      const tdDesc = document.createElement('td'); tdDesc.textContent = t.desc;
      const tdAmt = document.createElement('td'); tdAmt.textContent = fmt(t.amountCents / 100);
      [tdDate, tdOdb, tdDesc, tdAmt].forEach(td => tr.appendChild(td));
      tbody.appendChild(tr);
    });
    document.getElementById('donut-modal-summary').textContent = 'Łącznie: ' + rows.length + ' transakcji, ' + fmt(total);
    document.getElementById('donut-modal').classList.add('open');
  }

  function closeDonutModal() {
    document.getElementById('donut-modal').classList.remove('open');
  }

  document.getElementById('donut-modal-close').addEventListener('click', closeDonutModal);
  document.getElementById('donut-modal').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeDonutModal();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeDonutModal();
  });

  function renderTrend() {
    const now = new Date();
    const months = [];
    for (let i = 5; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      months.push({ key: toYMD(d).slice(0, 7), label: PL_MONTHS_SHORT[d.getMonth()] + ' ' + String(d.getFullYear()).slice(2) });
    }
    const incomeData = months.map(m =>
      transactions.filter(t => t.type === 'income' && t.date.startsWith(m.key)).reduce((s, t) => s + t.amountCents, 0) / 100
    );
    const expenseData = months.map(m =>
      transactions.filter(t => t.type === 'expense' && t.date.startsWith(m.key)).reduce((s, t) => s + t.amountCents, 0) / 100
    );

    if (trendChart) trendChart.destroy();
    trendChart = new Chart(document.getElementById('chart-trend'), {
      type: 'bar',
      data: {
        labels: months.map(m => m.label),
        datasets: [
          { label: 'Przychody', data: incomeData, backgroundColor: '#16a34a' },
          { label: 'Wydatki', data: expenseData, backgroundColor: '#dc2626' }
        ]
      },
      options: {
        responsive: true,
        plugins: { legend: { position: 'bottom' } },
        scales: { y: { beginAtZero: true } }
      }
    });
  }

  function truncLabel(s, max) { return s.length > max ? s.slice(0, max) + '…' : s; }

  function renderTop10() {
    const mode = document.getElementById('top10-mode').value;
    const filtered = transactions.filter(t => t.type === 'expense' && t.date >= chartFilterFrom && t.date <= chartFilterTo && t.odbiorca);
    const byOdbiorca = {};
    const countByOdbiorca = {};
    filtered.forEach(t => {
      byOdbiorca[t.odbiorca] = (byOdbiorca[t.odbiorca] || 0) + t.amountCents;
      countByOdbiorca[t.odbiorca] = (countByOdbiorca[t.odbiorca] || 0) + 1;
    });

    const source = mode === 'count' ? countByOdbiorca : byOdbiorca;
    const sorted = Object.entries(source).sort((a, b) => b[1] - a[1]).slice(0, 10);
    const labels = sorted.map(e => truncLabel(e[0], 25));
    const data = mode === 'count' ? sorted.map(e => e[1]) : sorted.map(e => e[1] / 100);
    const isAmount = mode === 'amount';

    if (top10Chart) top10Chart.destroy();
    top10Chart = new Chart(document.getElementById('chart-top10'), {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          data,
          backgroundColor: '#2563eb',
          borderRadius: 4,
          barThickness: 22
        }]
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: ctx => isAmount ? fmt(ctx.raw) : ctx.raw + ' transakcji'
            }
          }
        },
        scales: {
          x: {
            beginAtZero: true,
            ticks: { callback: v => isAmount ? v.toLocaleString('pl-PL') + ' zł' : v }
          },
          y: {
            ticks: { font: { size: 12 }, autoSkip: false }
          }
        }
      }
    });
  }

  document.getElementById('top10-mode').addEventListener('change', renderTop10);

  document.getElementById('date').valueAsDate = new Date();
  await loadData();
  buildCategorySelect();
  buildFilterMonthSelect();
  setPreset('month');

  setInterval(async () => {
    await loadData();
    buildCategorySelect();
    buildFilterMonthSelect();
    if (chartsActive) {
      buildChartsFilter();
      renderCharts();
    } else {
      render();
    }
  }, 10000);
  } // end initApp
</script>
</body>
</html>
