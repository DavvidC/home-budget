<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Budget</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f0f2f5; color: #222; }
    header { background: #2563eb; color: #fff; padding: 1rem 2rem; }
    header h1 { font-size: 1.5rem; }
    .summary { display: flex; gap: 1rem; padding: 1.5rem 2rem; flex-wrap: wrap; }
    .card { flex: 1; min-width: 160px; background: #fff; border-radius: 8px; padding: 1rem 1.5rem; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .card .label { font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: #666; }
    .card .amount { font-size: 1.75rem; font-weight: 700; margin-top: .25rem; }
    .card.income .amount { color: #16a34a; }
    .card.expenses .amount { color: #dc2626; }
    .card.balance .amount { color: #2563eb; }
    .main { display: flex; gap: 1.5rem; padding: 0 2rem 2rem; flex-wrap: wrap; }
    .form-section, .transactions-section { background: #fff; border-radius: 8px; padding: 1.5rem; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .form-section { flex: 0 0 300px; }
    .transactions-section { flex: 1; min-width: 280px; }
    h2 { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; }
    .form-group { margin-bottom: .75rem; }
    label { display: block; font-size: .8rem; color: #555; margin-bottom: .25rem; }
    input, select { width: 100%; padding: .5rem .75rem; border: 1px solid #d1d5db; border-radius: 6px; font-size: .9rem; }
    input:focus, select:focus { outline: 2px solid #2563eb; border-color: transparent; }
    .radio-group { display: flex; gap: .75rem; margin-top: .25rem; }
    .radio-group label { display: flex; align-items: center; gap: .35rem; font-size: .9rem; color: #222; cursor: pointer; }
    .radio-group input { width: auto; }
    button[type=submit] { width: 100%; background: #2563eb; color: #fff; border: none; padding: .6rem; border-radius: 6px; font-size: .95rem; cursor: pointer; margin-top: .5rem; }
    button[type=submit]:hover { background: #1d4ed8; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th { text-align: left; padding: .5rem .75rem; font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: #666; border-bottom: 1px solid #e5e7eb; }
    td { padding: .6rem .75rem; border-bottom: 1px solid #f3f4f6; }
    tr:last-child td { border-bottom: none; }
    .badge { display: inline-block; padding: .15rem .5rem; border-radius: 999px; font-size: .75rem; font-weight: 600; }
    .badge.income { background: #dcfce7; color: #15803d; }
    .badge.expense { background: #fee2e2; color: #b91c1c; }
    .del-btn { background: none; border: none; color: #9ca3af; cursor: pointer; font-size: 1rem; padding: 0 .25rem; }
    .del-btn:hover { color: #dc2626; }
    .empty { text-align: center; color: #9ca3af; padding: 2rem; }
  </style>
</head>
<body>
<header><h1>Home Budget</h1></header>

<div class="summary">
  <div class="card income">
    <div class="label">Income</div>
    <div class="amount" id="total-income">$0.00</div>
  </div>
  <div class="card expenses">
    <div class="label">Expenses</div>
    <div class="amount" id="total-expenses">$0.00</div>
  </div>
  <div class="card balance">
    <div class="label">Balance</div>
    <div class="amount" id="balance">$0.00</div>
  </div>
</div>

<div class="main">
  <div class="form-section">
    <h2>Add Transaction</h2>
    <form id="txn-form">
      <div class="form-group">
        <label>Description</label>
        <input type="text" id="desc" placeholder="e.g. Groceries" required>
      </div>
      <div class="form-group">
        <label>Amount ($)</label>
        <input type="number" id="amount" min="0.01" step="0.01" placeholder="0.00" required>
      </div>
      <div class="form-group">
        <label>Category</label>
        <input type="text" id="category" placeholder="e.g. Food">
      </div>
      <div class="form-group">
        <label>Date</label>
        <input type="date" id="date" required>
      </div>
      <div class="form-group">
        <label>Type</label>
        <div class="radio-group">
          <label><input type="radio" name="type" value="income"> Income</label>
          <label><input type="radio" name="type" value="expense" checked> Expense</label>
        </div>
      </div>
      <button type="submit">Add Transaction</button>
    </form>
  </div>

  <div class="transactions-section">
    <h2>Transactions</h2>
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Description</th>
          <th>Category</th>
          <th>Type</th>
          <th>Amount</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="txn-list"></tbody>
    </table>
    <div class="empty" id="empty-msg">No transactions yet.</div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'home_budget_txns';
  let transactions;
  try {
    transactions = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  } catch {
    transactions = [];
  }

  const form = document.getElementById('txn-form');
  const list = document.getElementById('txn-list');
  const emptyMsg = document.getElementById('empty-msg');

  document.getElementById('date').valueAsDate = new Date();

  function fmt(n) {
    return '$' + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(transactions));
  }

  function render() {
    list.innerHTML = '';
    const sorted = [...transactions].sort((a, b) => b.date.localeCompare(a.date));
    sorted.forEach(t => {
      const tr = document.createElement('tr');
      const tdDate = document.createElement('td');
      tdDate.textContent = t.date;
      const tdDesc = document.createElement('td');
      tdDesc.textContent = t.desc;
      const tdCat = document.createElement('td');
      tdCat.textContent = t.category || '—';
      const tdType = document.createElement('td');
      const badge = document.createElement('span');
      badge.className = 'badge ' + t.type;
      badge.textContent = t.type;
      tdType.appendChild(badge);
      const tdAmt = document.createElement('td');
      tdAmt.textContent = fmt(t.amountCents / 100);
      const tdDel = document.createElement('td');
      const delBtn = document.createElement('button');
      delBtn.className = 'del-btn';
      delBtn.dataset.id = t.id;
      delBtn.title = 'Delete';
      delBtn.textContent = '✕';
      tdDel.appendChild(delBtn);
      [tdDate, tdDesc, tdCat, tdType, tdAmt, tdDel].forEach(td => tr.appendChild(td));
      list.appendChild(tr);
    });
    emptyMsg.style.display = transactions.length ? 'none' : 'block';

    const income = transactions.filter(t => t.type === 'income').reduce((s, t) => s + t.amountCents, 0);
    const expenses = transactions.filter(t => t.type === 'expense').reduce((s, t) => s + t.amountCents, 0);
    document.getElementById('total-income').textContent = fmt(income / 100);
    document.getElementById('total-expenses').textContent = fmt(expenses / 100);
    document.getElementById('balance').textContent = fmt((income - expenses) / 100);
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    const type = form.querySelector('input[name=type]:checked').value;
    transactions.push({
      id: crypto.randomUUID(),
      desc: document.getElementById('desc').value.trim(),
      amountCents: Math.round(parseFloat(document.getElementById('amount').value) * 100),
      category: document.getElementById('category').value.trim(),
      date: document.getElementById('date').value,
      type
    });
    save();
    render();
    form.reset();
    document.getElementById('date').valueAsDate = new Date();
    form.querySelector('input[name=type][value=expense]').checked = true;
  });

  list.addEventListener('click', e => {
    const btn = e.target.closest('.del-btn');
    if (!btn) return;
    const id = btn.dataset.id;
    transactions = transactions.filter(t => t.id !== id);
    save();
    render();
  });

  render();
</script>
</body>
</html>
